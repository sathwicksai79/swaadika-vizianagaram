<head>
  <meta charset="UTF-8">

  <meta name="google-site-verification" content="G3duZH-Dx3E-6tiByZL-z8xBfM0QY32x1m31UDWbltg" />
  <title>{% block title %}SWAADIKA - Vizianagaram | Find What Tastes Right{% endblock %}</title>
  <meta name="description" content="Discover food spots in Vizianagaram with SWAADIKA. Restaurant rating predictions using Machine Learning.">
  
  <!-- FAVICON & BRAND ICONS (using images/logo.jpeg) -->
  <link rel="icon" type="image/jpeg" sizes="96x96" href="{{ url_for('static', filename='images/logo.jpeg') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo.jpeg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.jpeg') }}">

  <!-- OPENGRAPH SITE NAME (Replaces "Render" in Google & social previews) -->

  <meta property="og:title" content="SWAADIKA - Vizianagaram | Find What Tastes Right" />

  <!-- SCHEMA.ORG STRUCTURED DATA (Primary signal for Google Site Name) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "SWAADIKA",
    "alternateName": ["Swaadika Vizianagaram", "SWAADIKA - Vizianagaram"],
    "url": "https://swaadika-vizianagaram.onrender.com/"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* Drawer styling & Crimson Transitions */
    #aboutDrawerBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(41, 1, 9, 0.75);
      backdrop-filter: blur(8px);
      z-index: 99998;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #aboutDrawerPanel {
      position: fixed;
      top: 0;
      right: -580px;
      width: 100%;
      max-width: 530px;
      height: 100vh;
      background: linear-gradient(180deg, #38020b 0%, #200106 100%);
      color: #fdf2f4;
      z-index: 99999;
      box-shadow: -15px 0 45px rgba(0, 0, 0, 0.6);
      border-left: 1px solid rgba(246, 200, 96, 0.25);
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #aboutDrawerPanel.open {
      right: 0 !important;
    }
    #aboutDrawerBackdrop.open {
      display: block !important;
      opacity: 1 !important;
    }

    /* Mobile Enhancements */
    @media (max-width: 640px) {
      header.nav {
        padding: 14px 18px !important;
      }
      header.nav nav {
        gap: 14px !important;
      }
      #aboutDrawerPanel {
        max-width: 100vw !important;
      }
      .footer-card {
        min-width: 100% !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
